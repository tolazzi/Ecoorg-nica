/* ——— reveal ao rolar ——— */
function useReveal() {
  const ref = useRef(null);
  const [visivel, setVisivel] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (entradas) => entradas.forEach((e) => e.isIntersecting && setVisivel(true)),
      { threshold: 0.18 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return [ref, visivel];
}

              className={"hero-slide" + (i === slide ? " ativo" : "")}
              aria-hidden={i !== slide}
              tabIndex={i === slide ? 0 : -1}
              onClick={() => irPara(s.destino)}
            >
              <img src={s.img} alt={s.alt} />
            </button>
          ))}
        </div>
        <button className="seta esquerda" onClick={() => setSlide((slide - 1 + HERO.length) % HERO.length)} aria-label="Banner anterior">
          <ChevronLeft size={18} strokeWidth={1.2} />
        </button>
        <button className="seta direita" onClick={() => setSlide((slide + 1) % HERO.length)} aria-label="Próximo banner">
          <ChevronRight size={18} strokeWidth={1.2} />
        </button>
        <div className="hero-indice">
          {HERO.map((_, i) => (
            <button
              key={i}
              className={"tracinho" + (i === slide ? " ativo" : "")}
              onClick={() => setSlide(i)}
              aria-label={"Ir para o banner " + (i + 1)}
            />
          ))}
        </div>
      </section>

      {/* coleção */}
      <section id="colecao" className="colecao">
        <div className="colecao-cabeca">
          <h2>Coleção</h2>
          <p>Dez peças que se combinam entre si. Todas em tamanho único.</p>
        </div>

        <div className="filtros">
          <div className="filtro-linha">
            {OCASIOES.map((o) => (
              <button
                key={o.id}
                className={"pilula" + (ocasiao === o.id ? " ativa" : "")}
                onClick={() => setOcasiao(o.id)}
              >
                {o.rotulo}
              </button>
            ))}
          </div>
          <div className="filtro-linha discreta">
            {TECIDOS.map((t) => (
              <button
                key={t}
                className={"pilula fina" + (tecido === t ? " ativa" : "")}
                onClick={() => setTecido(tecido === t ? null : t)}
              >
                {t}
              </button>
            ))}
          </div>
        </div>

        <div className="grade">
          {lista.map((p) => (
            <article key={p.id} className="card" onClick={() => { setProduto(p); setVista(0); }}>
              <div className="card-foto">
                <img className="frente" src={p.img} alt={p.nome} />
                <img className="detalhe" src={p.det} alt="" />
                <span className="selo">{p.tecido === "Algodão orgânico" ? "Fibra natural" : "Tamanho único"}</span>
              </div>
              <div className="card-info">
                <h3>{p.nome}</h3>
                <span className="card-cor">{p.cor} · {p.tecido}</span>
                <span className="card-preco">{brl(p.preco)}</span>
              </div>
            </article>
          ))}
        </div>
        {lista.length === 0 && (
          <p className="vazio">Nenhuma peça com esse filtro. Escolha outro tecido ou volte para toda a coleção.</p>
        )}
      </section>

      {/* tecidos */}
      <section id="tecidos" className="tecidos">
        <h2>Os três tecidos da casa</h2>
        <div className="tecidos-grade">
          <div>
            <h3>Viscose de bambu</h3>
            <p>Fibra de crescimento rápido, sem irrigação intensiva. Cai pesado, respira leve e volta ao lugar sem passar.</p>
          </div>
          <div>
            <h3>Modal natural</h3>
            <p>Extraído da faia, com processo de circuito fechado. Macio no primeiro toque e ainda macio na quinquagésima lavagem.</p>
          </div>
          <div>
            <h3>Algodão orgânico</h3>
            <p>Cultivo sem agrotóxico, colheita manual. Encorpado o suficiente para estruturar volume sem esquentar.</p>
          </div>
        </div>
      </section>

      {/* manifesto */}
      <section id="manifesto" className={"manifesto" + (manifestoVis ? " visivel" : "")} ref={manifestoRef}>
        <div className="manifesto-img">
          <img src={IMG.barro} alt="Detalhe do tecido do Vestido Barro" />
        </div>
        <div className="manifesto-texto">
          <h2>Uma peça que não pergunta o seu tamanho.</h2>
          <p>
            Cada peça da Ecoorgânica nasce de fibras naturais e é finalizada à mão, em pequenos lotes. A modelagem
            é desenhada para acompanhar corpos diferentes com o mesmo caimento — por isso trabalhamos com tamanho único.
          </p>
          <p>
            O que fica é uma roupa que atravessa o dia inteiro: o voo, a reunião, o jantar sem hora para acabar.
            Você troca o sapato, não a roupa.
          </p>
          <div className="assinatura">
            <img src={MARCA.icone} alt="" />
            <span>Green Lifestyle desde 2016</span>
          </div>
        </div>
      </section>

      {/* footer */}
      <footer id="contato" className="rodape">
        <div className="news">
          <h3>Receba as próximas peças antes de todo mundo</h3>
          <div className="news-campo">
            <input placeholder="Seu e-mail" />
            <button>Quero receber</button>
          </div>
          <span className="news-nota">Enviamos poucas vezes por mês. Cancelar é um clique.</span>
        </div>
        <div className="rodape-cols">
          <div>
            <h4>Coleção</h4>
            <button onClick={() => { setOcasiao("viagem"); irPara("colecao"); }}>Peças de viagem</button>
            <button onClick={() => { setOcasiao("trabalho"); irPara("colecao"); }}>Peças de trabalho</button>
            <button onClick={() => { setOcasiao("casual"); irPara("colecao"); }}>Peças casuais</button>
          </div>
          <div>
            <h4>A marca</h4>
            <button onClick={() => irPara("manifesto")}>Nossa história</button>
            <button onClick={() => irPara("tecidos")}>Tecidos e origem</button>
            <button onClick={() => irPara("tecidos")}>Como cuidar</button>
          </div>
          <div>
            <h4>Atendimento</h4>
            <button>Trocas e devoluções</button>
            <button>Prazo de entrega</button>
            <button>Fale com a gente</button>
          </div>
          <div>
            <h4>Acompanhe</h4>
            <button>Instagram</button>
            <button>WhatsApp</button>
            <button>Pinterest</button>
          </div>
        </div>
        <div className="selos">
          <span>Produção artesanal</span>
          <span>Fibras certificadas</span>
          <span>Envio para todo o Brasil</span>
          <span>Primeira troca por nossa conta</span>
        </div>
        <div className="rodape-base">
          <img src={MARCA.nome} alt="Ecoorgânica" />
          <span>Green Lifestyle · Curitiba, Brasil</span>
        </div>
      </footer>

      {/* menu mobile */}
      {menu && (
        <div className="cortina" onClick={() => setMenu(false)}>
          <div className="menu" onClick={(e) => e.stopPropagation()}>
            <button className="icone fechar" onClick={() => setMenu(false)} aria-label="Fechar menu">
              <X size={18} strokeWidth={1.3} />
            </button>
            <button onClick={() => irPara("colecao")}>Coleção</button>
            <button onClick={() => irPara("manifesto")}>Sobre</button>
            <button onClick={() => irPara("tecidos")}>Tecidos</button>
            <button onClick={() => irPara("contato")}>Contato</button>
          </div>
        </div>
      )}

      {/* página de produto */}
      {produto && (
        <div className="pdp" ref={pdpRef}>
          <div className="pdp-topo">
            <button className="voltar-loja" onClick={() => setProduto(null)}>
              <ChevronLeft size={16} strokeWidth={1.3} />
              Voltar à coleção
            </button>
            <button
              className="pdp-marca"
              onClick={() => { setProduto(null); window.scrollTo({ top: 0, behavior: "smooth" }); }}
              aria-label="Ir para a página inicial"
            >
              <img src={MARCA.nome} alt="Ecoorgânica" />
            </button>
            <div className="acoes">
              <button className="icone sacola-btn" onClick={() => setSacolaAberta(true)} aria-label="Abrir sacola">
                <ShoppingBag size={17} strokeWidth={1.3} />
                {contador > 0 && <span className="contador">{contador}</span>}
              </button>
            </div>
          </div>

          <div className="pdp-corpo">
            <div className="pdp-galeria">
              <div className="galeria-trilho" key={produto.id} onScroll={(e) => {
                const l = e.currentTarget;
                setVista(Math.round(l.scrollLeft / l.clientWidth));
              }}>
                {[produto.img, produto.det].map((src, i) => (
                  <figure key={i}>
                    <img src={src} alt={produto.nome + (i === 0 ? " — look completo" : " — detalhe do tecido")} />
                  </figure>
                ))}
              </div>
              <div className="galeria-pontos">
                {[0, 1].map((i) => (
                  <span key={i} className={"ponto-foto" + (i === vista ? " ativo" : "")} />
                ))}
              </div>
            </div>

            <div className="pdp-info">
              <span className="migalha">Coleção · {produto.ocasioes.map((o) => o[0].toUpperCase() + o.slice(1)).join(" · ")}</span>
              <h1>{produto.nome}</h1>
              <span className="produto-preco">{brl(produto.preco)}</span>
              <p className="produto-resumo">{produto.resumo}</p>

              <div className="cores">
                <span className="rotulo">Cor: {NOMES_COR[produto.swatches[corSel]] || produto.cor}</span>
                <div className="chips">
                  {produto.swatches.map((c, i) => (
                    <button
                      key={c}
                      type="button"
                      className={"chip" + (i === corSel ? " ativo" : "")}
                      style={{ background: c }}
                      onClick={() => setCorSel(i)}
                      aria-pressed={i === corSel}
                      aria-label={NOMES_COR[c] || "Cor " + (i + 1)}
                      title={NOMES_COR[c] || "Cor " + (i + 1)}
                    />
                  ))}
                </div>
              </div>

              <div className="fit">
                <strong>Tamanho único</strong>
                <p>{produto.fit}</p>
              </div>

              <button className="cta-destaque" onClick={() => adicionar(produto, NOMES_COR[produto.swatches[corSel]] || produto.cor)}>Adicionar à sacola</button>
              <span className="pdp-garantia">Primeira troca por nossa conta · Envio para todo o Brasil</span>

              <dl className="ficha">
                <div>
                  <dt>Tecido</dt>
                  <dd>{produto.tecido}. Fibra natural, produção em pequenos lotes com acabamento manual.</dd>
                </div>
                <div>
                  <dt>Cuidados</dt>
                  <dd>{produto.cuidados}</dd>
                </div>
                <div>
                  <dt>Entrega</dt>
                  <dd>Envio padrão gratuito em 5 a 8 dias úteis. Expresso em 2 a 3 dias úteis.</dd>
                </div>
              </dl>
            </div>
          </div>

          <section className="pdp-avaliacoes">
            <h2>Quem já veste</h2>
            <div className="avaliacoes-grade">
              {produto.avaliacoes.map((a) => (
                <blockquote key={a.nome}>
                  <p>{a.texto}</p>
                  <cite>{a.nome}</cite>
                </blockquote>
              ))}
            </div>
          </section>

          <section className="pdp-relacionados">
            <h2>Combina com</h2>
            <div className="relacionados-trilho">
              {PRODUTOS.filter((r) => r.id !== produto.id).slice(0, 4).map((r) => (
                <button key={r.id} onClick={() => { setProduto(r); setVista(0); }}>
                  <img src={r.img} alt={r.nome} />
                  <span className="rel-nome">{r.nome}</span>
                  <span className="rel-preco">{brl(r.preco)}</span>
                </button>
              ))}
            </div>
          </section>

          <div className="pdp-rodape">
            <button onClick={() => setProduto(null)}>Voltar à coleção</button>
          </div>
        </div>
      )}

      {/* sacola */}
      {sacolaAberta && (
        <div className="cortina" onClick={() => setSacolaAberta(false)}>
          <aside className="sacola" onClick={(e) => e.stopPropagation()}>
            <div className="sacola-topo">
              <h3>Sua sacola</h3>
              <button className="icone" onClick={() => setSacolaAberta(false)} aria-label="Fechar sacola">
                <X size={18} strokeWidth={1.3} />
              </button>
            </div>

            {itens.length === 0 ? (
              <div className="sacola-vazia">
                <p>Sua sacola está vazia.</p>
                <button className="cta-escuro" onClick={() => { setSacolaAberta(false); irPara("colecao"); }}>
                  Ver coleção
                </button>
              </div>
            ) : (
              <>
                <div className="sacola-itens">
                  {itens.map((i) => (
                    <div key={i.id} className="sacola-item">
                      <img src={i.img} alt={i.nome} />
                      <div>
                        <h4>{i.nome}</h4>
                        <span>{i.cor} · Tamanho único</span>
                        <div className="qtd">
                          <button onClick={() => mudarQtd(i.id, -1)} aria-label="Diminuir">
                            <Minus size={13} strokeWidth={1.4} />
                          </button>
                          <span>{i.qtd}</span>
                          <button onClick={() => mudarQtd(i.id, 1)} aria-label="Aumentar">
                            <Plus size={13} strokeWidth={1.4} />
                          </button>
                        </div>
                      </div>
                      <span className="sacola-preco">{brl(i.preco * i.qtd)}</span>
                    </div>
                  ))}
                </div>
                <div className="sacola-base">
                  <div className="subtotal">
                    <span>Subtotal</span>
                    <span>{brl(total)}</span>
                  </div>
                  <span className="frete-nota">Frete calculado na próxima etapa. Primeira troca por nossa conta.</span>
                  <button className="cta-escuro" onClick={() => { setSacolaAberta(false); setCheckout(true); setEtapa(0); }}>
                    Finalizar compra
                  </button>
                </div>
              </>
            )}
          </aside>
        </div>
      )}

      {/* checkout */}
      {checkout && (
        <div className="checkout">
          <div className="checkout-topo">
            <img src={MARCA.nome} alt="Ecoorgânica" />
            <button className="icone" onClick={() => setCheckout(false)} aria-label="Voltar à loja">
              <X size={18} strokeWidth={1.3} />
            </button>
          </div>

          <div className="checkout-corpo">
            <div className="checkout-form">
              <div className="passos">
                {["Dados", "Entrega", "Pagamento"].map((p, i) => (
                  <button key={p} className={"passo" + (i === etapa ? " ativo" : "") + (i < etapa ? " feito" : "")} onClick={() => setEtapa(i)}>
                    {i < etapa ? <Check size={13} strokeWidth={1.6} /> : <span className="ponto" />}
                    {p}
                  </button>
                ))}
              </div>

              {etapa === 0 && (
                <div className="campos">
                  <label>Nome completo<input placeholder="Como está no documento" /></label>
                  <label>E-mail<input placeholder="voce@email.com" /></label>
                  <div className="dupla">
                    <label>CPF<input placeholder="000.000.000-00" /></label>
                    <label>Celular<input placeholder="(41) 90000-0000" /></label>
                  </div>
                </div>
              )}

              {etapa === 1 && (
                <div className="campos">
                  <label>CEP<input placeholder="80000-000" /></label>
                  <label>Endereço<input placeholder="Rua e número" /></label>
                  <div className="dupla">
                    <label>Cidade<input placeholder="Curitiba" /></label>
                    <label>Estado<input placeholder="PR" /></label>
                  </div>
                  <div className="entregas">
                    <label className="entrega selecionada">
                      <span>Envio padrão · 5 a 8 dias úteis</span>
                      <strong>Grátis</strong>
                    </label>
                    <label className="entrega">
                      <span>Envio expresso · 2 a 3 dias úteis</span>
                      <strong>{brl(49)}</strong>
                    </label>
                  </div>
                </div>
              )}

              {etapa === 2 && (
                <div className="campos">
                  <label>Número do cartão<input placeholder="0000 0000 0000 0000" /></label>
                  <div className="dupla">
                    <label>Validade<input placeholder="MM/AA" /></label>
                    <label>CVV<input placeholder="000" /></label>
                  </div>
                  <label>Nome impresso no cartão<input placeholder="Nome do titular" /></label>
                  <label>Parcelamento
                    <select defaultValue="3">
                      <option value="1">1x de {brl(total)} sem juros</option>
                      <option value="3">3x de {brl(Math.round(total / 3))} sem juros</option>
                      <option value="6">6x de {brl(Math.round(total / 6))} sem juros</option>
                    </select>
                  </label>
                </div>
              )}

              <div className="checkout-acoes">
                {etapa > 0 && (
                  <button className="voltar" onClick={() => setEtapa(etapa - 1)}>
                    <ChevronLeft size={15} strokeWidth={1.4} /> Voltar
                  </button>
                )}
                <button
                  className="cta-escuro"
                  onClick={() => (etapa < 2 ? setEtapa(etapa + 1) : setCheckout(false))}
                >
                  {etapa < 2 ? "Continuar" : "Pagar " + brl(total)}
                </button>
              </div>
            </div>

            <aside className="resumo">
              <h4>Seu pedido</h4>
              {itens.map((i) => (
                <div key={i.id} className="resumo-item">
                  <img src={i.img} alt="" />
                  <div>
                    <span>{i.nome}</span>
                    <span className="resumo-detalhe">{i.cor} · {i.qtd} un.</span>
                  </div>
                  <strong>{brl(i.preco * i.qtd)}</strong>
                </div>
              ))}
              <div className="resumo-linha"><span>Subtotal</span><span>{brl(total)}</span></div>
              <div className="resumo-linha"><span>Entrega</span><span>Grátis</span></div>
              <div className="resumo-total"><span>Total</span><strong>{brl(total)}</strong></div>
            </aside>
          </div>
        </div>
      )}
    </div>
  );
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap');

.eco{
  --tinta:#1C1C1A; --papel:#F2F0E9; --mata:#2E4A32; --folha:#A9C89A;
  --pedra:#DCD8CC; --sombra:#6E6C63; --branco:#FBFAF6;
  background:var(--papel); color:var(--tinta);
  font-family:'Jost','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.eco *{box-sizing:border-box;}
.eco h1,.eco h2,.eco h3,.eco blockquote p{
  font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  font-weight:300; letter-spacing:.005em;
}
.eco button{font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; font-size:inherit;}
.eco input,.eco select{font-family:inherit; font-size:15px; color:var(--tinta);}
.eco button:focus-visible,.eco input:focus-visible,.eco select:focus-visible{outline:1.5px solid var(--mata); outline-offset:3px;}
.eco img{display:block; max-width:100%;}

/* ——— aviso ——— */
.aviso{background:var(--mata); color:var(--branco); text-align:center; padding:9px 16px; overflow:hidden;}
.aviso-frase{display:inline-block; font-size:11.5px; letter-spacing:.14em; animation:sobe .7s ease both;}
@keyframes sobe{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

/* ——— header ——— */
.topo{
  position:sticky; top:0; z-index:40; background:rgba(242,240,233,.92);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--pedra);
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  padding:14px 20px; gap:12px;
}
.nav{display:flex; gap:26px;}
.nav button{font-size:13px; letter-spacing:.05em; padding:4px 0; border-bottom:1px solid transparent; transition:border-color .25s;}
.nav button:hover{border-color:var(--mata);}
.marca{display:flex; align-items:center; justify-self:center; text-decoration:none;}
.marca-nome{width:158px; image-rendering:auto;}
.acoes{display:flex; gap:6px; justify-content:flex-end;}
.icone{display:grid; place-items:center; width:36px; height:36px; border-radius:50%; transition:background .2s;}
.icone:hover{background:rgba(46,74,50,.08);}
.sacola-btn{position:relative;}
.contador{
  position:absolute; top:3px; right:2px; min-width:16px; height:16px; padding:0 4px;
  background:var(--mata); color:var(--branco); border-radius:9px;
  font-size:10px; line-height:16px; text-align:center;
}
.hamb{width:17px; height:1px; background:var(--tinta); position:relative; display:block;}
.hamb::before,.hamb::after{content:''; position:absolute; left:0; width:17px; height:1px; background:var(--tinta);}
.hamb::before{top:-5px;} .hamb::after{top:5px;}
.so-mobile{display:none;} .so-desktop{display:flex;}

.busca{
  position:sticky; top:65px; z-index:39; display:flex; align-items:center; gap:8px;
  background:var(--branco); border-bottom:1px solid var(--pedra); padding:10px 20px;
}
.busca input{flex:1; border:0; background:none; padding:6px 0;}
.busca input::placeholder{color:var(--sombra);}

/* ——— hero ——— */
.hero{position:relative; width:100%; background:var(--papel);}
.hero-palco{position:relative; width:100%; aspect-ratio:1376/768; overflow:hidden; background:var(--pedra);}
.hero-slide{position:absolute; inset:0; padding:0; opacity:0; pointer-events:none; transition:opacity 1.2s ease;}
.hero-slide.ativo{opacity:1; pointer-events:auto;}
.hero-slide img{width:100%; height:100%; object-fit:cover;}
.seta{
  position:absolute; top:50%; transform:translateY(-50%); z-index:3;
  display:grid; place-items:center; width:38px; height:38px; border-radius:50%;
  background:rgba(251,250,246,.72); color:var(--tinta); opacity:0; transition:opacity .3s,background .2s;
}
.hero:hover .seta{opacity:1;}
.seta:hover{background:var(--branco);}
.seta.esquerda{left:14px;} .seta.direita{right:14px;}
.hero-indice{display:flex; justify-content:center; gap:8px; padding:14px 0 2px;}

/* no desktop o carrossel fica contido, para não dominar a tela */
@media (min-width:861px){
  .hero{padding:clamp(16px,2vw,28px) clamp(20px,4vw,48px) 0;}
  .hero-palco{max-width:min(1120px,calc(100vh - 210px) * 1.792); margin:0 auto;}
  .seta.esquerda{left:calc((100% - min(1120px,(100vh - 210px) * 1.792)) / 2 + 14px);}
  .seta.direita{right:calc((100% - min(1120px,(100vh - 210px) * 1.792)) / 2 + 14px);}
}
.tracinho{width:26px; height:1.5px; background:var(--pedra); transition:background .3s,width .3s;}
.tracinho.ativo{background:var(--mata); width:44px;}

/* ——— manifesto ——— */
.manifesto{
  display:grid; grid-template-columns:1fr 1fr; gap:0; align-items:stretch;
  background:var(--branco); border-block:1px solid var(--pedra);
}
.manifesto-img{overflow:hidden; max-height:620px;}
.manifesto-img img{width:100%; height:100%; object-fit:cover; object-position:50% 35%; transform:scale(1.06); opacity:0; transition:opacity 1.2s ease,transform 1.6s ease;}
.manifesto.visivel .manifesto-img img{opacity:1; transform:scale(1);}
.manifesto-texto{padding:clamp(32px,6vw,84px); align-self:center; max-width:56ch;}
.manifesto-texto h2{font-size:clamp(27px,3.6vw,42px); line-height:1.14; margin:0 0 22px;}
.manifesto-texto p{margin:0 0 16px; color:var(--sombra); font-size:15px;}
.manifesto-texto p:first-of-type{color:var(--tinta);}
.assinatura{display:flex; align-items:center; gap:10px; margin-top:26px; padding-top:20px; border-top:1px solid var(--pedra);}
.assinatura img{width:22px; height:22px; border-radius:50%;}
.assinatura span{font-size:11.5px; letter-spacing:.1em; color:var(--sombra);}

/* ——— coleção ——— */
.colecao{padding:clamp(48px,7vw,96px) clamp(16px,4vw,48px);}
.colecao-cabeca{text-align:center; margin-bottom:34px;}
.colecao-cabeca h2{font-size:clamp(28px,4vw,44px); margin:0 0 8px;}
.colecao-cabeca p{margin:0; color:var(--sombra); font-size:14px;}
.filtros{display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:40px;}
.filtro-linha{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}
.pilula{
  border:1px solid var(--pedra); padding:8px 18px; border-radius:999px;
  font-size:12.5px; letter-spacing:.05em; color:var(--sombra); transition:all .25s;
}
.pilula:hover{border-color:var(--mata); color:var(--tinta);}
.pilula.ativa{background:var(--mata); border-color:var(--mata); color:var(--branco);}
.pilula.fina{border-color:transparent; padding:5px 12px; font-size:11.5px;}
.pilula.fina.ativa{background:var(--folha); color:var(--mata);}
.grade{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(14px,2vw,28px);}
.card{cursor:pointer;}
.card-foto{position:relative; overflow:hidden; aspect-ratio:3/4; background:var(--pedra);}
.card-foto img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 18%;}
.card-foto .frente{transition:opacity .6s ease,transform 1.2s ease;}
.card-foto .detalhe{opacity:0; object-position:50% 50%; transition:opacity .6s ease;}
.card:hover .detalhe{opacity:1;}
.card:hover .frente{opacity:0;}
.selo{
  position:absolute; left:12px; top:12px; background:rgba(251,250,246,.9); color:var(--mata);
  font-size:10px; letter-spacing:.1em; padding:5px 10px; z-index:2;
}
.card-info{display:flex; flex-direction:column; gap:2px; padding:14px 2px 0;}
.card-info h3{margin:0; font-size:20px;}
.card-cor{font-size:11.5px; letter-spacing:.06em; color:var(--sombra);}
.card-preco{font-size:13.5px; margin-top:4px;}
.vazio{text-align:center; color:var(--sombra); padding:40px 0;}

/* ——— tecidos ——— */
.tecidos{background:var(--mata); color:var(--branco); padding:clamp(48px,7vw,90px) clamp(16px,4vw,48px);}
.tecidos h2{font-size:clamp(26px,3.4vw,38px); margin:0 0 36px; text-align:center;}
.tecidos-grade{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(24px,4vw,56px); max-width:1080px; margin:0 auto;}
.tecidos-grade h3{margin:0 0 10px; font-size:22px; color:var(--folha);}
.tecidos-grade p{margin:0; font-size:14px; opacity:.85; max-width:34ch;}

/* ——— rodapé ——— */
.rodape{background:var(--branco); border-top:1px solid var(--pedra); padding:clamp(40px,6vw,72px) clamp(16px,4vw,48px) 32px;}
.news{max-width:520px; margin:0 auto 56px; text-align:center;}
.news h3{margin:0 0 16px; font-size:clamp(22px,3vw,30px);}
.news-campo{display:flex; border-bottom:1px solid var(--tinta);}
.news-campo input{flex:1; border:0; background:none; padding:10px 2px;}
.news-campo input::placeholder{color:var(--sombra);}
.news-campo button{font-size:12px; letter-spacing:.12em; padding:0 4px 0 16px; white-space:nowrap;}
.news-nota{display:block; margin-top:10px; font-size:11.5px; color:var(--sombra);}
.rodape-cols{display:grid; grid-template-columns:repeat(4,1fr); gap:28px; max-width:1080px; margin:0 auto;}
.rodape-cols h4{margin:0 0 12px; font-size:11.5px; letter-spacing:.12em; font-weight:400;}
.rodape-cols button{display:block; font-size:13px; color:var(--sombra); padding:4px 0; transition:color .2s;}
.rodape-cols button:hover{color:var(--tinta);}
.selos{
  display:flex; flex-wrap:wrap; justify-content:center; gap:8px 28px;
  margin:52px auto 0; padding-top:24px; border-top:1px solid var(--pedra); max-width:1080px;
}
.selos span{font-size:11px; letter-spacing:.1em; color:var(--sombra);}
.rodape-base{display:flex; flex-direction:column; align-items:center; gap:8px; margin-top:32px;}
.rodape-base img{width:150px; opacity:.9;}
.rodape-base span{font-size:11px; letter-spacing:.1em; color:var(--sombra);}

/* ——— cortinas ——— */
.cortina{position:fixed; inset:0; z-index:60; background:rgba(28,28,26,.42); backdrop-filter:blur(2px); animation:aparece .3s ease;}
@keyframes aparece{from{opacity:0;}to{opacity:1;}}
.fechar{position:absolute; top:14px; right:14px; z-index:5; background:var(--branco);}

/* menu mobile */
.menu{
  position:absolute; inset:0 22% 0 0; background:var(--papel); padding:78px 28px;
  display:flex; flex-direction:column; gap:4px; animation:desliza .35s ease;
}
.menu button{text-align:left; font-family:'Cormorant Garamond',Georgia,serif; font-size:26px; padding:8px 0;}
.menu .fechar{font-size:0;}
@keyframes desliza{from{transform:translateX(-100%);}to{transform:none;}}
/* página de produto */
.pdp{
  position:fixed; inset:0; z-index:65; background:var(--papel); overflow-y:auto;
  -webkit-overflow-scrolling:touch; animation:aparece .3s ease;
}
.pdp-topo{
  position:sticky; top:0; z-index:5; display:grid; grid-template-columns:1fr auto 1fr;
  align-items:center; gap:12px; padding:14px 20px;
  background:rgba(242,240,233,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--pedra);
}
.voltar-loja{display:flex; align-items:center; gap:5px; font-size:12.5px; letter-spacing:.06em; color:var(--sombra); transition:color .2s;}
.voltar-loja:hover{color:var(--tinta);}
.pdp-marca{justify-self:center; padding:0;}
.pdp-marca img{width:148px;}
.pdp-corpo{
  display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);
  gap:clamp(28px,5vw,80px); max-width:1240px; margin:0 auto;
  padding:clamp(24px,4vw,56px) clamp(16px,4vw,48px) 0; align-items:start;
}
.pdp-galeria{position:relative;}
.galeria-trilho{display:grid; gap:16px;}
.galeria-trilho figure{margin:0; background:var(--pedra); overflow:hidden;}
.galeria-trilho img{width:100%; height:auto; display:block;}
.galeria-pontos{display:none;}
.pdp-info{position:sticky; top:96px; max-width:52ch; padding-bottom:24px;}
.migalha{display:block; font-size:11px; letter-spacing:.12em; color:var(--sombra); margin-bottom:14px;}
.pdp-info h1{margin:0 0 6px; font-size:clamp(32px,4vw,46px); line-height:1.08;}
.produto-preco{display:block; font-size:17px; margin-bottom:22px;}
.produto-resumo{margin:0 0 28px; color:var(--sombra); font-size:15px;}
.cores{margin-bottom:26px;}
.rotulo{display:block; font-size:12px; letter-spacing:.06em; color:var(--sombra); margin-bottom:9px;}
.chips{display:flex; gap:10px;}
.chip{width:26px; height:26px; border-radius:50%; border:1px solid var(--pedra); transition:box-shadow .2s,transform .2s;}
.chip:hover{transform:scale(1.08);}
.chip.ativo{box-shadow:0 0 0 1.5px var(--papel),0 0 0 3px var(--mata);}
.fit{background:var(--branco); border-left:2px solid var(--folha); padding:18px 20px; margin-bottom:26px;}
.fit strong{display:block; font-weight:400; font-size:12.5px; letter-spacing:.1em; margin-bottom:7px;}
.fit p{margin:0; font-size:13.5px; color:var(--sombra);}
.cta-escuro{
  width:100%; background:var(--mata); color:var(--branco); padding:17px 24px;
  font-size:12.5px; letter-spacing:.16em; transition:background .3s;
}
.cta-escuro:hover{background:#243B27;}
.cta-destaque{
  width:100%; padding:17px 24px; border-radius:999px;
  background:var(--folha); color:var(--mata); border:1px solid #93B584;
  font-size:12.5px; letter-spacing:.16em;
  transition:background .3s ease,color .3s ease,border-color .3s ease,transform .15s ease;
}
.cta-destaque:hover{background:var(--mata); border-color:var(--mata); color:var(--branco);}
.cta-destaque:active{background:#243B27; border-color:#243B27; color:var(--branco); transform:scale(.985);}
.pdp-garantia{display:block; text-align:center; margin-top:12px; font-size:11.5px; letter-spacing:.06em; color:var(--sombra);}
.ficha{margin:36px 0 0; padding:0; display:grid;}
.ficha > div{padding:18px 0; border-top:1px solid var(--pedra);}
.ficha dt{font-size:11.5px; letter-spacing:.12em; margin-bottom:6px;}
.ficha dd{margin:0; font-size:13.5px; color:var(--sombra);}
.pdp-avaliacoes{
  max-width:1160px; margin:clamp(48px,6vw,80px) auto 0;
  padding:clamp(32px,4vw,56px) clamp(22px,4vw,56px);
  background:#EAF0E1; border:1px solid #DAE4CC; border-radius:22px;
  box-shadow:0 18px 44px -32px rgba(46,74,50,.55);
}
.pdp-avaliacoes h2{color:var(--mata);}
.pdp-avaliacoes h2,.pdp-relacionados h2{margin:0 0 28px; font-size:clamp(24px,3vw,32px);}
.avaliacoes-grade{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(20px,3vw,44px);}
.avaliacoes-grade blockquote{margin:0;}
.avaliacoes-grade p{margin:0 0 8px; font-size:19px; line-height:1.45; font-style:italic;}
.avaliacoes-grade cite{font-style:normal; font-size:11.5px; letter-spacing:.08em; color:var(--sombra);}
.pdp-relacionados{max-width:1240px; margin:0 auto; padding:clamp(24px,4vw,44px) clamp(16px,4vw,48px) 0; border-top:1px solid var(--pedra);}
.relacionados-trilho{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(12px,2vw,24px);}
.relacionados-trilho button{text-align:left; display:grid; gap:4px;}
.relacionados-trilho img{width:100%; aspect-ratio:3/4; object-fit:cover; object-position:50% 16%; margin-bottom:8px;}
.rel-nome{font-family:'Cormorant Garamond',Georgia,serif; font-size:19px;}
.rel-preco{font-size:12.5px; color:var(--sombra);}
.pdp-rodape{display:flex; justify-content:center; padding:56px 20px 72px;}
.pdp-rodape button{border:1px solid var(--tinta); padding:14px 40px; font-size:12px; letter-spacing:.16em; transition:background .3s,color .3s;}
.pdp-rodape button:hover{background:var(--tinta); color:var(--branco);}


/* sacola */
.sacola{
  position:absolute; top:0; right:0; bottom:0; width:min(420px,90vw); background:var(--papel);
  display:flex; flex-direction:column; animation:entra .35s ease;
}
@keyframes entra{from{transform:translateX(100%);}to{transform:none;}}
.sacola-topo{display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--pedra);}
.sacola-topo h3{margin:0; font-size:24px;}
.sacola-vazia{padding:48px 24px; text-align:center; color:var(--sombra); display:grid; gap:20px;}
.sacola-itens{flex:1; overflow-y:auto; padding:8px 20px;}
.sacola-item{display:grid; grid-template-columns:64px 1fr auto; gap:14px; padding:18px 0; border-bottom:1px solid var(--pedra);}
.sacola-item img{width:64px; height:86px; object-fit:cover; object-position:50% 18%;}
.sacola-item h4{margin:0 0 2px; font-family:'Cormorant Garamond',Georgia,serif; font-weight:400; font-size:19px;}
.sacola-item > div > span{font-size:11.5px; color:var(--sombra); letter-spacing:.05em;}
.qtd{display:flex; align-items:center; gap:12px; margin-top:10px; border:1px solid var(--pedra); width:max-content; padding:3px 8px;}
.qtd span{font-size:12.5px;}
.qtd button{display:grid; place-items:center; width:20px; height:20px;}
.sacola-preco{font-size:13.5px;}
.sacola-base{padding:20px; border-top:1px solid var(--pedra); background:var(--branco);}
.subtotal{display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px;}
.frete-nota{display:block; font-size:11.5px; color:var(--sombra); margin-bottom:16px;}

/* checkout */
.checkout{position:fixed; inset:0; z-index:70; background:var(--papel); overflow-y:auto; animation:aparece .3s ease;}
.checkout-topo{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; border-bottom:1px solid var(--pedra);}
.checkout-topo img{width:140px;}
.checkout-corpo{display:grid; grid-template-columns:1.4fr 1fr; gap:clamp(24px,5vw,72px); max-width:1080px; margin:0 auto; padding:clamp(28px,5vw,56px) clamp(16px,4vw,32px) 80px;}
.passos{display:flex; gap:22px; margin-bottom:32px; padding-bottom:14px; border-bottom:1px solid var(--pedra);}
.passo{display:flex; align-items:center; gap:7px; font-size:12.5px; letter-spacing:.08em; color:var(--sombra);}
.passo.ativo{color:var(--tinta);}
.passo.feito{color:var(--mata);}
.ponto{width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.5;}
.passo.ativo .ponto{opacity:1;}
.campos{display:grid; gap:16px;}
.campos label{display:grid; gap:6px; font-size:11.5px; letter-spacing:.1em; color:var(--sombra);}
.campos input,.campos select{border:1px solid var(--pedra); background:var(--branco); padding:12px 14px; letter-spacing:normal;}
.campos input::placeholder{color:#A5A29A;}
.dupla{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.entregas{display:grid; gap:10px; margin-top:6px;}
.entrega{display:flex; align-items:center; justify-content:space-between; border:1px solid var(--pedra); background:var(--branco); padding:14px 16px; cursor:pointer; letter-spacing:normal; font-size:13.5px; color:var(--tinta);}
.entrega.selecionada{border-color:var(--mata); box-shadow:inset 2px 0 0 var(--mata);}
.entrega strong{font-weight:400;}
.checkout-acoes{display:flex; align-items:center; gap:20px; margin-top:28px;}
.voltar{display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--sombra); white-space:nowrap;}
.checkout-acoes .cta-escuro{max-width:280px;}
.resumo{background:var(--branco); border:1px solid var(--pedra); padding:24px; align-self:start;}
.resumo h4{margin:0 0 18px; font-size:11.5px; letter-spacing:.12em; font-weight:400;}
.resumo-item{display:grid; grid-template-columns:48px 1fr auto; gap:12px; align-items:center; padding-bottom:14px; margin-bottom:14px; border-bottom:1px solid var(--pedra);}
.resumo-item img{width:48px; height:62px; object-fit:cover; object-position:50% 18%;}
.resumo-item span{display:block; font-size:13.5px;}
.resumo-detalhe{font-size:11.5px; color:var(--sombra);}
.resumo-item strong{font-weight:400; font-size:13px;}
.resumo-linha{display:flex; justify-content:space-between; font-size:13.5px; color:var(--sombra); padding:3px 0;}
.resumo-total{display:flex; justify-content:space-between; font-size:16px; margin-top:12px; padding-top:12px; border-top:1px solid var(--pedra);}
.resumo-total strong{font-weight:400;}

/* ——— responsivo ——— */
@media (max-width:1024px){
  .grade{grid-template-columns:repeat(3,1fr);}
  .pdp-corpo{grid-template-columns:1fr; gap:28px;}
  .pdp-info{position:static; max-width:none;}
  .avaliacoes-grade{grid-template-columns:1fr; gap:24px;}
  .pdp-avaliacoes{margin-inline:clamp(16px,4vw,48px);}
  .checkout-corpo{grid-template-columns:1fr;}
  .resumo{order:-1;}
}
@media (max-width:760px){
  .so-mobile{display:grid;} .so-desktop{display:none;}
  .topo{padding:12px 14px;}
  .marca-nome{width:134px;}
  .grade{grid-template-columns:repeat(2,1fr);}
  .manifesto{grid-template-columns:1fr;}
  .manifesto-img{max-height:380px;}
  .tecidos-grade{grid-template-columns:1fr; gap:26px;}
  .rodape-cols{grid-template-columns:1fr 1fr; gap:24px;}
  .seta{display:none;}
  .card-info h3{font-size:17px;}
  .pdp-topo{padding:12px 14px;}
  .pdp-marca img{width:124px;}
  .voltar-loja span{display:none;}
  .pdp-corpo{padding:0 0 0;}
  .galeria-trilho{
    display:flex; gap:0; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .galeria-trilho::-webkit-scrollbar{display:none;}
  .galeria-trilho figure{flex:0 0 100%; scroll-snap-align:center;}
  .galeria-pontos{display:flex; justify-content:center; gap:7px; padding:14px 0 0;}
  .ponto-foto{width:6px; height:6px; border-radius:50%; background:var(--pedra);}
  .ponto-foto.ativo{background:var(--mata);}
  .pdp-info{padding:28px 20px 0;}
  .relacionados-trilho{grid-template-columns:repeat(2,1fr);}
  .dupla{grid-template-columns:1fr;}
  .checkout-acoes{flex-direction:row-reverse; justify-content:flex-end;}
  .selos{gap:6px 18px;}
}
@media (hover:none){
  .card-foto .detalhe{display:none;}
}
@media (prefers-reduced-motion:reduce){
  .eco *{animation:none !important; transition:none !important;}
}

ReactDOM.createRoot(document.getElementById("raiz")).render(<Ecoorganica />);

<script>
(function () {
  var aviso = document.getElementById("aviso");
  function falhar(msg) {
    aviso.className = "erro";
    aviso.textContent = "Não foi possível carregar a página. " + msg;
  }
  // cada biblioteca tem um endereço principal e um reserva
  var libs = [
    ["https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
     "https://unpkg.com/react@18.3.1/umd/react.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
     "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js",
     "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"]
  ];
  function carregar(i) {
    if (i >= libs.length) return montar();
    var tentativa = 0;
    function tentar() {
      var s = document.createElement("script");
      s.src = libs[i][tentativa];
      s.onload = function () { carregar(i + 1); };
      s.onerror = function () {
        tentativa++;
        if (tentativa < libs[i].length) tentar();
        else falhar("Verifique a conexão com a internet e recarregue.");
      };
      document.head.appendChild(s);
    }
    tentar();
  }
  function montar() {
    try {
      var fonte = document.getElementById("fonte").textContent;
      var compilado = Babel.transform(fonte, { presets: ["react"] }).code;
      (0, eval)(compilado);
      aviso.remove();
    } catch (e) {
      falhar(String(e && e.message ? e.message : e));
    }
  }
  carregar(0);
})();
</script>

const TONS = [
  { face: "#355B33", verso: "#7FA66E" },
  { face: "#2E4A32", verso: "#6E9A5E" },
  { face: "#4C7742", verso: "#9DC08B" },
  { face: "#628F52", verso: "#B4CCA0" },
  { face: "#86AE71", verso: "#CBDCBB" },
  { face: "#9AA84E", verso: "#CFCE94" },
];

function Folhas({ reduzido }) {
  const ref = useRef(null);

  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    let raf, largura, altura, dpr;

    const medir = () => {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      largura = canvas.clientWidth;
      altura = canvas.clientHeight;
      canvas.width = largura * dpr;
      canvas.height = altura * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    medir();

    // as folhas acompanham o tamanho da tela, para não ficarem grandes demais no celular
    const escala = Math.max(0.5, Math.min(1.05, Math.min(largura, altura) / 820));
    const N = reduzido ? 14 : largura < 620 ? 20 : 36;
    const folhas = [];
    const rnd = (a, b) => a + Math.random() * (b - a);

    for (let i = 0; i < N; i++) {
      const z = rnd(0.45, 1.25);            // profundidade
      const tom = TONS[(Math.random() * TONS.length) | 0];
      const rgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      folhas.push({
        z,
        tam: rnd(15, 25) * z * escala,
        larg: rnd(0.36, 0.56),              // relação largura/comprimento
        assim: rnd(0.84, 1.18),             // assimetria entre os dois lados
        curva: rnd(0.36, 0.52),
        tom,
        face: rgb(tom.face),
        verso: rgb(tom.verso),
        concha: rnd(0.28, 0.62),            // quanto a folha "encurva" na largura
        arco: rnd(0.1, 0.34),               // quanto ela verga no comprimento
        inclin: rnd(-0.5, 0.5),             // inclinação no eixo horizontal
        vInclin: rnd(0.0004, 0.0013) * (Math.random() < 0.5 ? -1 : 1),
        alfa: Math.min(0.92, 0.34 + z * 0.48),
        // posição e movimento
        x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0,
        rot: rnd(-0.6, 0.6),
        giro: rnd(0, Math.PI * 2),          // rotação no próprio eixo (frente/verso)
        vgiro: rnd(0.003, 0.011) * (Math.random() < 0.5 ? -1 : 1),
        freq: rnd(0.00042, 0.0009),
        fase: rnd(0, Math.PI * 2),
        balanco: rnd(0.22, 0.62),
        // funil
        ang: rnd(0, Math.PI * 2),
        vang: rnd(0.018, 0.034),
        altF: Math.random(),
        vAlt: rnd(0.0016, 0.0038),
        raioBase: rnd(0.18, 1),
      });
    }

    // luz vinda de cima à esquerda, ligeiramente à frente
    const LUZ = (() => {
      const v = [-0.34, -0.58, 0.74];
      const m = Math.hypot(v[0], v[1], v[2]);
      return [v[0] / m, v[1] / m, v[2] / m];
    })();

    const FAIXAS = largura < 620 ? 6 : 9;   // tiras ao longo da largura da folha
    const AMOSTRAS = 7;                     // pontos ao longo do comprimento

    // perfil da folha: meia-largura em função da posição no comprimento
    const perfil = (u) => Math.pow(Math.max(0, 1 - u * u), 0.58) * (0.66 + 0.34 * (1 - (u + 1) / 2));

    const desenhar = (f, cx, cy, rot, giro) => {
      const t = f.tam;
      const meia = t * f.larg;
      const cosG = Math.cos(giro), sinG = Math.sin(giro);
      const cosI = Math.cos(f.inclin), sinI = Math.sin(f.inclin);
      const cosR = Math.cos(rot), sinR = Math.sin(rot);
      const foco = 420;

      // ponto da superfície da folha em 3D, já projetado na tela
      const ponto = (u, sv) => {
        const lado = sv < 0 ? f.assim : 1;
        const larguraU = perfil(u) * meia * lado;
        let X = sv * larguraU;
        let Y = u * t;
        // superfície curva: concha na largura + arco no comprimento
        let Z = -f.concha * larguraU * (sv * sv) + f.arco * t * 0.35 * (u * u - 0.33);
        // giro no próprio eixo (comprimento)
        let x1 = X * cosG + Z * sinG;
        let z1 = -X * sinG + Z * cosG;
        // inclinação para frente/trás
        let y1 = Y * cosI - z1 * sinI;
        let z2 = Y * sinI + z1 * cosI;
        // rotação no plano da tela
        const x2 = x1 * cosR - y1 * sinR;
        const y2 = x1 * sinR + y1 * cosR;
        const p = foco / (foco - z2 * 0.9);
        return [cx + x2 * p, cy + y2 * p, z2];
      };

      const normal = (u, sv) => {
        const e = 0.16;
        const a = ponto(u, sv), b = ponto(u + e, sv), c = ponto(u, Math.min(1, sv + e));
        const ab = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
        const ac = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
        const n = [
          ab[1] * ac[2] - ab[2] * ac[1],
          ab[2] * ac[0] - ab[0] * ac[2],
          ab[0] * ac[1] - ab[1] * ac[0],
        ];
        const m = Math.hypot(n[0], n[1], n[2]) || 1;
        return [n[0] / m, n[1] / m, n[2] / m];
      };

      ctx.save();
      ctx.globalAlpha = f.alfa;

      for (let i = 0; i < FAIXAS; i++) {
        const s0 = -1 + (2 * i) / FAIXAS;
        const s1 = -1 + (2 * (i + 1)) / FAIXAS;
        const sm = (s0 + s1) / 2;

        const n = normal(0, sm);
        const paraFrente = n[2] >= 0;
        const nl = paraFrente ? n : [-n[0], -n[1], -n[2]];
        const lamb = Math.max(0, nl[0] * LUZ[0] + nl[1] * LUZ[1] + nl[2] * LUZ[2]);
        const base = paraFrente ? f.face : f.verso;
        // ambiente + difusa; o verso é sempre mais claro e menos saturado
        const k = 0.42 + lamb * 0.7;
        const cor =
          "rgb(" +
          Math.min(255, (base[0] * k) | 0) + "," +
          Math.min(255, (base[1] * k) | 0) + "," +
          Math.min(255, (base[2] * k) | 0) + ")";

        ctx.beginPath();
        for (let j = 0; j <= AMOSTRAS; j++) {
          const u = -1 + (2 * j) / AMOSTRAS;
          const pt = ponto(u, s0);
          if (j === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
        }
        for (let j = AMOSTRAS; j >= 0; j--) {
          const u = -1 + (2 * j) / AMOSTRAS;
          const pt = ponto(u, s1);
          ctx.lineTo(pt[0], pt[1]);
        }
        ctx.closePath();
        ctx.fillStyle = cor;
        ctx.fill();
        // fecha a costura entre as tiras
        ctx.strokeStyle = cor;
        ctx.lineWidth = 0.7;
        ctx.stroke();

        // reflexo especular quando a tira fica de frente para a luz
        if (lamb > 0.82) {
          ctx.globalAlpha = f.alfa * (lamb - 0.82) * 1.6;
          ctx.fillStyle = "rgba(255,255,255,.55)";
          ctx.fill();
          ctx.globalAlpha = f.alfa;
        }
      }

      // nervura central acompanhando a curvatura
      ctx.strokeStyle = "rgba(18,34,18,.26)";
      ctx.lineWidth = Math.max(0.5, t * 0.03);
      ctx.beginPath();
      for (let j = 0; j <= AMOSTRAS; j++) {
        const u = -1 + (2 * j) / AMOSTRAS;
        const pt = ponto(u, 0);
        if (j === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]);
      }
      ctx.stroke();

      // nervuras laterais
      ctx.strokeStyle = "rgba(18,34,18,.16)";
      ctx.lineWidth = Math.max(0.35, t * 0.02);
      for (let k = -2; k <= 2; k++) {
        const u = k * 0.3;
        const a = ponto(u, 0);
        const b = ponto(u - 0.22, 0.78);
        const c = ponto(u - 0.22, -0.78);
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(c[0], c[1]);
        ctx.stroke();
      }

      // pecíolo
      const base0 = ponto(1, 0);
      const base1 = ponto(1.22, 0);
      ctx.strokeStyle = "rgba(60,84,52,.75)";
      ctx.lineWidth = Math.max(0.6, t * 0.05);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(base0[0], base0[1]);
      ctx.lineTo(base1[0], base1[1]);
      ctx.stroke();

      ctx.restore();
    };

    // rajadas de vento: faixas que atravessam a tela e arrastam as folhas
    const rajadas = [];
    let proximaRajada = 4200;
    const criarRajada = () => {
      const faixa = rnd(200, 460);
      const yBase = rnd(altura * 0.12, altura * 0.88);
      rajadas.push({
        x: -faixa,
        vel: rnd(2.2, 4.2),
        faixa,
        forca: rnd(0.16, 0.36),
        y: yBase,
        alturaFaixa: rnd(altura * 0.35, altura * 0.8),
        vida: 0,
        fios: Array.from({ length: (6 + Math.random() * 6) | 0 }, () => ({
          dx: rnd(-1, 1),
          dy: rnd(-0.5, 0.5),
          comp: rnd(60, 190),
          curva: rnd(-16, 16),
          esp: rnd(0.6, 1.5),
          alfa: rnd(0.05, 0.13),
        })),
      });
    };

    const desenharVento = (dt) => {
      for (let i = rajadas.length - 1; i >= 0; i--) {
        const r = rajadas[i];
        r.x += r.vel * dt;
        r.vida += dt;
        if (r.x > largura + r.faixa * 2) { rajadas.splice(i, 1); continue; }
        const entrada = Math.min(1, r.vida / 40);
        const saida = Math.min(1, (largura + r.faixa * 2 - r.x) / (r.faixa * 2));
        const forca = entrada * saida;
        ctx.save();
        ctx.lineCap = "round";
        for (const fio of r.fios) {
          const x = r.x + fio.dx * r.faixa;
          const y = r.y + fio.dy * r.alturaFaixa * 0.5;
          ctx.globalAlpha = fio.alfa * forca;
          ctx.strokeStyle = "#7E9A76";
          ctx.lineWidth = fio.esp;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + fio.comp * 0.5, y + fio.curva, x + fio.comp, y + fio.curva * 0.35);
          ctx.stroke();
        }
        ctx.restore();
      }
    };

    const T_FUNIL = 2200;
    const T_ABERTURA = 3800;
    let inicio = performance.now();
    let anterior = inicio;

    const quadro = (agora) => {
      const t = agora - inicio;
      const dt = Math.min(2.4, (agora - anterior) / 16.67) || 1;
      anterior = agora;
      ctx.clearRect(0, 0, largura, altura);

      // vento com rajadas: soma de senos de períodos diferentes
      const vento =
        0.19 + 0.09 * Math.sin(t / 6400) + 0.07 * Math.sin(t / 2900 + 1.3) + 0.03 * Math.sin(t / 1250 + 0.4);

      if (t > T_FUNIL) {
        if (t > proximaRajada) {
          criarRajada();
          proximaRajada = t + rnd(4200, 8600);
        }
        desenharVento(dt);
      }

      const cx = largura / 2;
      const cy = altura / 2;

      for (const f of folhas) {
        if (t < T_FUNIL) {
          // funil: estreito embaixo, aberto em cima, girando mais rápido no centro
          f.altF = (f.altF + f.vAlt * dt) % 1;
          const abertura = 0.22 + f.altF * 1.15;
          const raio = f.raioBase * Math.min(largura, altura) * 0.34 * abertura;
          f.ang += f.vang * dt * (1.25 - f.altF * 0.5);
          const x = cx + Math.cos(f.ang) * raio + Math.sin(t / 700) * 12;
          const y = cy + (0.58 - f.altF) * altura * 0.92;
          f.px = f.x || x; f.py = f.y || y;
          f.x = x; f.y = y;
          f.giro += (f.vgiro * 2.1) * dt;
          f.inclin = Math.sin(t * 0.0016 + f.fase) * 0.8;
          f.rot = f.ang + Math.PI / 2 + Math.sin(t / 420 + f.fase) * 0.26;
          desenhar(f, x, y, f.rot, f.giro);
        } else {
          if (t < T_ABERTURA) {
            if (!f.solta) {
              // herda a velocidade que a folha trazia do giro, mais um empurrão para fora
              f.vx = (f.x - f.px) * 0.75 + Math.cos(f.ang) * 2.1 * f.z;
              f.vy = (f.y - f.py) * 0.75 + Math.sin(f.ang * 1.3) * 1.3;
              f.solta = true;
            }
            f.vx *= Math.pow(0.982, dt);
            f.vy *= Math.pow(0.982, dt);
            f.vy += 0.011 * dt;                       // um pouco de gravidade
          } else {
            // voo contínuo: vento + flutuação própria de folha caindo
            const alvo = vento * (0.55 + f.z * 0.5);
            f.vx += (alvo - f.vx) * 0.012 * dt;
            f.vy += (Math.sin(t * f.freq * 0.7 + f.fase * 1.7) * 0.14 * f.balanco - f.vy) * 0.03 * dt;
          }

          // a folha sente a rajada que passa por ela
          for (const r of rajadas) {
            const d = (f.x - r.x) / (r.faixa * 0.9);
            const dv = (f.y - r.y) / (r.alturaFaixa * 0.7);
            const perto = Math.exp(-(d * d) - dv * dv);
            if (perto > 0.02) {
              f.vx += r.forca * perto * 0.09 * f.z * dt;
              f.vy -= r.forca * perto * 0.03 * dt;
              f.giro += r.forca * perto * 0.02 * dt;
              f.rot += r.forca * perto * 0.006 * dt;
            }
          }

          const oscila = Math.sin(t * f.freq + f.fase) * f.balanco;
          f.x += (f.vx + oscila * 0.3) * dt;
          f.y += (f.vy + Math.cos(t * f.freq * 1.3 + f.fase) * 0.13 * f.balanco) * dt;
          f.giro += f.vgiro * (0.42 + Math.abs(oscila) * 0.7) * dt;
          f.inclin += (Math.sin(t * f.freq * 1.6 + f.fase) * 0.55 - f.inclin) * 0.02 * dt;
          f.rot += (oscila * 0.008 - f.rot * 0.003) * dt;

          const margem = f.tam * 3;
          if (f.x > largura + margem) { f.x = -margem; f.y = Math.random() * altura; }
          if (f.x < -margem * 1.5) f.x = largura + margem;
          if (f.y > altura + margem) f.y = -margem;
          if (f.y < -margem * 1.5) f.y = altura + margem;

          desenhar(f, f.x, f.y, f.rot, f.giro);
        }
      }
      raf = requestAnimationFrame(quadro);
    };

    if (reduzido) {
      folhas.forEach((f, i) => {
        const a = (i / folhas.length) * Math.PI * 2;
        desenhar(
          f,
          largura / 2 + Math.cos(a) * largura * 0.36,
          altura / 2 + Math.sin(a * 1.6) * altura * 0.3,
          a,
          a * 0.7
        );
      });
    } else {
      raf = requestAnimationFrame(quadro);
    }

    const aoRedimensionar = () => medir();
    window.addEventListener("resize", aoRedimensionar);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", aoRedimensionar);
    };
  }, [reduzido]);

  return <canvas ref={ref} className="folhas" aria-hidden="true" />;
}


/* ——— fios de tecido: ondulam sempre e se desembaraçam ao rolar ——— */
const trava = (v) => Math.min(1, Math.max(0, v));
const suave = (v) => v * v * (3 - 2 * v);

// traçado sem quinas: curvas quadráticas passando pelos pontos médios
const macio = (pts) => {
  if (pts.length < 3) return "";
  let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1) + " ";
  for (let k = 1; k < pts.length - 1; k++) {
    const mx = (pts[k][0] + pts[k + 1][0]) / 2;
    const my = (pts[k][1] + pts[k + 1][1]) / 2;
    d += "Q" + pts[k][0].toFixed(1) + " " + pts[k][1].toFixed(1) + " " + mx.toFixed(1) + " " + my.toFixed(1) + " ";
  }
  const u = pts[pts.length - 1];
  d += "L" + u[0].toFixed(1) + " " + u[1].toFixed(1);
  return d;
};

// tons de fio cru: linho, algodão e um verde lavado
const CORES_FIO = ["#C6CEB9", "#D2CEBF", "#BFCDAE", "#DAD5C7", "#B4C4A2", "#CFC9B6"];

const criarFios = (n) =>
  Array.from({ length: n }, (_, i) => {
    const ordem = i / (n - 1);
    return {
      ordem,
      faixa: 46 + ordem * 505,
      voltasX: 0.7 + ((i * 7) % 5) * 0.16,
      voltasY: 1.1 + ((i * 5) % 6) * 0.14,
      fase: i * 1.37,
      ampX: 360 + ((i * 11) % 7) * 26,
      ampY: 120 + ((i * 13) % 6) * 16,
      amp: 10 + ((i * 3) % 4) * 4,
      onda: 0.0044 + (i % 6) * 0.0008,
      vel: 0.00018 + (i % 5) * 0.00006,
      amp2: 3 + ((i * 5) % 6),
      onda2: 0.0105 + (i % 4) * 0.0016,
      vel2: 0.00034 - (i % 5) * 0.00003,
      // aparência do fio
      cor: CORES_FIO[i % CORES_FIO.length],
      espessura: 0.7 + ((i * 7) % 5) * 0.16,     // nenhum fio tem a mesma grossura
      torcao: 0.8 + ((i * 3) % 4) * 0.3,          // amplitude da torção das fibras
      passoTorcao: 18 + ((i * 5) % 7) * 4,        // quantas voltas a torção dá
    };
  });

function Fios({ progresso }) {
  const refs = useRef([]);
  const pRef = useRef(0);
  pRef.current = progresso;
  const fios = useMemo(
    () => criarFios(typeof window !== "undefined" && window.innerWidth < 620 ? 9 : 13),
    []
  );

  useEffect(() => {
    let raf;
    const AMOSTRAS = 78;
    const passo = (agora) => {
      const p = pRef.current;
      for (let i = 0; i < fios.length; i++) {
        const f = fios[i];
        const alvo = refs.current[i];
        if (!alvo || !alvo.nucleo) continue;

        const bruto = trava((p - 0.02 - f.ordem * 0.4) / 0.3);
        const abrir = 1 - Math.pow(1 - bruto, 3);
        const desloc = p * 300;

        // 1) traçado central do fio
        const pts = [];
        for (let k = 0; k <= AMOSTRAS; k++) {
          const tt = k / AMOSTRAS;

          const angX = tt * f.voltasX * Math.PI * 2 + f.fase + agora * 0.00022;
          const angY = tt * f.voltasY * Math.PI * 2 + f.fase * 1.4 + agora * 0.00017;
          const xNovelo = 600 + Math.sin(angX) * f.ampX * (0.82 + 0.18 * Math.sin(tt * 5.3 + f.fase));
          const yNovelo = f.faixa * 0.45 + 180 + Math.cos(angY) * f.ampY;

          const xLinha = -220 + tt * 1640;
          const yLinha =
            f.faixa +
            Math.sin((xLinha + desloc) * f.onda + agora * f.vel + f.fase) * f.amp +
            Math.sin((xLinha + desloc * 1.6) * f.onda2 + agora * f.vel2 + f.fase * 2) * f.amp2;

          const m = suave(trava(abrir * 1.5 - tt * 0.5));
          pts.push([xNovelo + (xLinha - xNovelo) * m, yNovelo + (yLinha - yNovelo) * m]);
        }

        // 2) fibras torcidas em volta do eixo, usando a normal do traçado
        const nucleo = [], fibraA = [], fibraB = [];
        for (let k = 0; k < pts.length; k++) {
          const [x, y] = pts[k];
          const a = pts[Math.max(0, k - 1)];
          const b = pts[Math.min(pts.length - 1, k + 1)];
          const dx = b[0] - a[0], dy = b[1] - a[1];
          const comp = Math.hypot(dx, dy) || 1;
          const nx = -dy / comp, ny = dx / comp;
          const giro = Math.sin((k / AMOSTRAS) * f.passoTorcao + f.fase + agora * 0.0004) * f.torcao;
          const giro2 = Math.sin((k / AMOSTRAS) * f.passoTorcao + f.fase + Math.PI * 0.85 + agora * 0.0004) * f.torcao;
          nucleo.push([x, y]);
          fibraA.push([x + nx * giro, y + ny * giro]);
          fibraB.push([x + nx * giro2 * 0.8, y + ny * giro2 * 0.8]);
        }
        const dN = macio(nucleo), dA = macio(fibraA), dB = macio(fibraB);

        alvo.halo.setAttribute("d", dN);
        alvo.nucleo.setAttribute("d", dN);
        alvo.fibraA.setAttribute("d", dA);
        alvo.fibraB.setAttribute("d", dB);
        alvo.g.style.opacity = (0.5 - abrir * 0.32).toFixed(3);
      }
      raf = requestAnimationFrame(passo);
    };
    raf = requestAnimationFrame(passo);
    return () => cancelAnimationFrame(raf);
  }, [fios]);

  return (
    <svg className="fios" viewBox="0 0 1200 600" preserveAspectRatio="none" aria-hidden="true">
      {fios.map((f, i) => (
        <g key={i} ref={(el) => { refs.current[i] = { ...(refs.current[i] || {}), g: el }; }}>
          {/* penugem do linho */}
          <path
            ref={(el) => { refs.current[i] = { ...(refs.current[i] || {}), halo: el }; }}
            className="fio-halo"
            stroke={f.cor}
            strokeWidth={f.espessura * 3.6}
          />
          <path
            ref={(el) => { refs.current[i] = { ...(refs.current[i] || {}), nucleo: el }; }}
            className="fio-nucleo"
            stroke={f.cor}
            strokeWidth={f.espessura}
          />
          <path
            ref={(el) => { refs.current[i] = { ...(refs.current[i] || {}), fibraA: el }; }}
            className="fio-fibra"
            stroke={f.cor}
            strokeWidth={f.espessura * 0.62}
          />
          <path
            ref={(el) => { refs.current[i] = { ...(refs.current[i] || {}), fibraB: el }; }}
            className="fio-fibra"
            stroke="#A8B896"
            strokeWidth={f.espessura * 0.45}
          />
        </g>
      ))}
    </svg>
  );
}

/* ——— progresso de rolagem ——— */
function useProgresso(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0;
    const calcular = () => {
      raf = 0;
      const r = el.getBoundingClientRect();
      const total = r.height - window.innerHeight;
      if (total <= 0) { setP(r.top < 0 ? 1 : 0); return; }
      setP(Math.min(1, Math.max(0, -r.top / total)));
    };
    const aoRolar = () => { if (!raf) raf = requestAnimationFrame(calcular); };
    calcular();
    window.addEventListener("scroll", aoRolar, { passive: true });
    window.addEventListener("resize", aoRolar);
    return () => {
      window.removeEventListener("scroll", aoRolar);
      window.removeEventListener("resize", aoRolar);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [ref]);
  return p;
}

function useTravessia(ref) {
  const [p, setP] = useState(0);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let raf = 0;
    const calcular = () => {
      raf = 0;
      const r = el.getBoundingClientRect();
      const total = r.height + window.innerHeight;
      setP(Math.min(1, Math.max(0, (window.innerHeight - r.top) / total)));
    };
    const aoRolar = () => { if (!raf) raf = requestAnimationFrame(calcular); };
    calcular();
    window.addEventListener("scroll", aoRolar, { passive: true });
    window.addEventListener("resize", aoRolar);
    return () => {
      window.removeEventListener("scroll", aoRolar);
      window.removeEventListener("resize", aoRolar);
      if (raf) cancelAnimationFrame(raf);
    };
  }, [ref]);
  return p;
}

function useRevelar(margem = "-18%") {
  const ref = useRef(null);
  const [visivel, setVisivel] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      (e) => e.forEach((x) => x.isIntersecting && setVisivel(true)),
      { rootMargin: `0px 0px ${margem} 0px` }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, [margem]);
  return [ref, visivel];
}

const surgir = (p, inicio, janela = 0.12) => {
  const a = Math.min(1, Math.max(0, (p - inicio) / janela));
  return { opacity: a, transform: `translateY(${(1 - a) * 22}px)`, transition: "opacity .5s ease, transform .5s ease" };
};

          <div className="provas">
            {t.provas.map((pr, i) => (
              <div key={pr.titulo} style={{ opacity: pDec > 0.66 + i * 0.06 ? 1 : 0 }}>
                <strong>{pr.titulo}</strong>
                <span>{pr.texto}</span>
              </div>
            ))}
          </div>
          <div className="numeros" style={{ opacity: pDec > 0.88 ? 1 : 0 }}>
            {t.numeros.map((n) => (
              <div key={n.rotulo}>
                <strong>{n.valor}</strong>
                <span>{n.rotulo}</span>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* presença */}
      <section className={"presenca" + (presVis ? " visivel" : "")} ref={presRef}>
        <div className="presenca-texto">
          <span className="eyebrow">{t.presencaEyebrow}</span>
          <h2>{t.presencaTitulo}</h2>
          <p>{t.presencaTexto}</p>
          <ul>
            {t.presencaLugares.map((l) => <li key={l}>{l}</li>)}
          </ul>
        </div>
        <Rota de={t.origem2} para={t.destino} />
      </section>

      {/* coleção — única fotografia do site, leva à loja */}
      <section className={"colecao" + (colVis ? " visivel" : "")} ref={colRef}>
        <img src={FOTO_COLECAO} alt="" />
        <div className="colecao-veu" />
        <div className="colecao-texto">
          <span className="eyebrow">{t.conviteEyebrow}</span>
          <h2>{t.conviteTitulo}</h2>
          <p>{t.conviteTexto}</p>
          <a className="botao-destaque" href={LOJA} target="_blank" rel="noopener noreferrer">{t.conviteBotao}</a>
        </div>
      </section>

      <footer className="rodape">
        <div>
          <h3>{t.contatoTitulo}</h3>
          <ul>
            {t.contato.map((c) => (
              <li key={c}><a href="#contato" onClick={(e) => e.preventDefault()}>{c}</a></li>
            ))}
          </ul>
        </div>
        <div className="rodape-marca">
          <img src={WORDMARK} alt="Ecoorgânica" />
          <span>{t.rodape}</span>
        </div>
      </footer>
    </div>
  );
}

<script>
(function () {
  var aviso = document.getElementById("aviso");
  function falhar(msg) {
    aviso.className = "erro";
    aviso.textContent = "Não foi possível carregar a página. " + msg;
  }
  // cada biblioteca tem um endereço principal e um reserva
  var libs = [
    ["https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js",
     "https://unpkg.com/react@18.3.1/umd/react.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js",
     "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"],
    ["https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js",
     "https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"]
  ];
  function carregar(i) {
    if (i >= libs.length) return montar();
    var tentativa = 0;
    function tentar() {
      var s = document.createElement("script");
      s.src = libs[i][tentativa];
      s.onload = function () { carregar(i + 1); };
      s.onerror = function () {
        tentativa++;
        if (tentativa < libs[i].length) tentar();
        else falhar("Verifique a conexão com a internet e recarregue.");
      };
      document.head.appendChild(s);
    }
    tentar();
  }
  function montar() {
    try {
      var fonte = document.getElementById("fonte").textContent;
      var compilado = Babel.transform(fonte, { presets: ["react"] }).code;
      (0, eval)(compilado);
      aviso.remove();
    } catch (e) {
      falhar(String(e && e.message ? e.message : e));
    }
  }
  carregar(0);
})();
</script>
